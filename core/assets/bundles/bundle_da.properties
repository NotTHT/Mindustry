sector.groundZero.description=Startpunktet for din ekspansion på Serpulo. Rig på kobber og bly. Byg din base op, udvind ressourcer og forbered dig på fjendtlige angreb.
sector.frozenForest.description=Et frossent skovområde rigt på biomasse og kul. Udnyt kul til kraftværker for at forsyne dine forsvarsværker.
sector.saltFlats.description=Flade, åbne sletter ideelle til storskala logistik og ressourcefordeling.
sector.crateredBattleground.description = Vand har samlet sig i dette krater, et levn fra de gamle krige. Genindtag området. Saml sand. Smelt metaglas. Pump vand til afkøling af tårne og bor.
sector.ruinousShores.description=Kystlinje kontrolleret af fjendtlige styrker. Tilgang til havs og rige titaniumforekomster. Etabler stærke kystforsvar.
sector.stainedMountains.description=Bjergrigt terræn med mineralske årer. Godt beskyttet naturligt forsvarsområde.
sector.overgrowth.description=En tæt bevokset sektor med skjulte fjendtlige strukturer og rige mineralforekomster.
sector.tarFields.description=Et område rigt på råolie og tjære. Udnyt olie til plast og brændstof, men pas på brandfare.
sector.desolateRift.description=Et ekstremt faretruende område med voldsomme fjendtlige bølger. Kræver avanceret teknologi og maksimal automatisering.
sector.nuclearComplex.description=Et kraftfuldt atomkraftanlæg. Thoriumforekomster muliggør enorm energiproduktion.
sector.fungalPass.description=Et smalt bjergpas med etablerede fjendtlige baser. Kræver direkte angreb på fjendens kerne.
sector.biomassFacility.description=Et forladt forskningsanlæg for biomasse. Mulighed for energiproduktion via organisk materiale.
sector.windsweptIslands.description=En øgruppe præget af kraftig vind. Rig på thorium og sand. Kræver luftbåren logistik og stærk luftforsvar.
sector.extractionOutpost.description=En fjendtlig udvinningsforpost. Ødelæg fjendens kerne for at overtage sektoren.
sector.impact0078.description=Stedet for et historisk rumskibsvrag. Indeholder værdifuld teknologi og avanceret udstyr.
sector.planetaryTerminal.description=Hovedkvarteret for fjendens overfladeoperationer. Erobring af denne terminal er afgørende for fuldstændig kontrol over planeten.
sector.coastline.description=Sektor med adgang til havområder og råstoffer. Etabler flåde- og kystforsvar.
sector.navalFortress.description=Fjendtlig flådebase med tunge forsvarsværker. Kræver flådeenheder og langtrækkende artilleri.
sector.facility32m.description = Denne sektor indeholder de hensygnende rester af et produktionsanlæg for sprængstoffer.\n\nIndtag dette område. Udforsk sprængstofblanderen. Fremstil sprængstofblanding til brug som ammunition i tårne.
sector.taintedWoods.description = [gray][optional objective][]\nRich in oil reserves, this sector contains large masses of fungal growth, making it difficult to traverse.\n\nUtilize its resources to produce Plastanium. Fend off the enemy.
sector.sunkenPier.description = [gray][optional objective][]\nOnce an offshore oil platform, this facility has long-since fallen into disrepair.\n\nHigh amounts of enemy naval units detected. Be prepared for attacks from multiple directions.
sector.atolls.description = [gray][optional objective][]\nMultiple enemy naval bases have been detected at this location.\n\nUtilize Mega payload units to transport ground forces into attack positions. Build naval units to destroy the peripheral outposts.
sector.frontier.description = En lille fjendtlig forpost er blevet opdaget her.\n\nByg Mono-enheder for at høste ressourcer mere effektivt. Brug den additive rekonstruktør til at bygge stærkere enheder.
sector.infestedCanyons.description = Beyond the mountains lies a winding river valley, now covered in layers of spore moss.\n\nHold your ground against the enemy onslaught. Construct naval units. Eliminate all enemy cores.
sector.testingGrounds.description = [gray][optional objective][]\nA crater-riddled desert valley, formerly used as a testing ground for military projects.\n\nDue to lack of water, establishing a presence in this location may pose a challenge. Be prepared for attacks from multiple directions.
sector.perilousHarbor.description = Multiple enemy bases have been established across this treacherous coastal region.\n\nConstruct naval units, and crush their fortifications.
sector.weatheredChannels.description = [gray][optional objective][]\nThis channel system harbors abundant resources. Land your core. Fend off the enemy waves to claim them.\n\nThe enemy will take multiple routes to assault your infrastructure. Look for signs of a possible ambush and defend accordingly.
sector.mycelialBastion.description = This fortified complex lies deep within the fungal regions, threatening neighboring sectors with advanced insectoid units.\n\nAssault the complex. Obtain the technology within. Utilize units capable of traversing walls.
sector.littoralShipyard.description = Located upon the far reaches of the central sea, this naval production facility contains technology for building advanced units.\n\nDestroy this facility, and use its technology to further assist in the completion of the final objective.

